[project]
name = "gp-assistant-rag-evals"
version = "0.1.0"
description = "Frozen RAG and Agent evaluation harness for GP Assistant"
requires-python = ">=3.11,<3.14"
dependencies = [
  "deepeval==4.2.6",
  "socksio>=1.0.0",
]

[project.scripts]
gp-rag-eval = "runner:main"

[tool.setuptools]
py-modules = ["runner"]
