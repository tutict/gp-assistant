[package]
name = "stock-research"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
resolver = "3"

[lib]
name = "gp_research"

[features]
default = []
cli = []

[[bin]]
name = "stock-research"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
gp_core = { package = "stock-optimizer-core", path = "../gp-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "clock"] }
sha2 = "0.11.1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
csv = "1.4.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
