[package]
name = "stock-optimizer-core"
version = "0.3.0"
edition = "2021"
description = "Embeddable stock screening core for Stock Optimizer"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
