[package]
name = "gp-core"
version = "0.1.0"
edition = "2021"
description = "Embeddable stock screening core for GP Assistant"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
