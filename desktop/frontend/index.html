<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>股选优</title>
    <link rel="icon" href="/assets/logo-mark-v2.png" />
    <script>
      const requestedTheme = new URLSearchParams(window.location.search).get("theme");
      const savedTheme =
        requestedTheme === "dark" || requestedTheme === "light"
          ? requestedTheme
          : localStorage.getItem("stock-optimizer-theme");
      document.documentElement.dataset.theme = savedTheme || "dark";
      const requestedDensity = new URLSearchParams(window.location.search).get("density");
      const savedDensity = requestedDensity === "compact" || requestedDensity === "comfortable"
        ? requestedDensity
        : localStorage.getItem("stock-optimizer-density");
      document.documentElement.dataset.density = savedDensity === "compact" ? "compact" : "comfortable";
    </script>
    <style>
      html {
        --splash-bg: #0d1014;
        --splash-text: #f4f7fa;
        --splash-muted: #a9b4bf;
        --splash-accent: #a92924;
      }
      html[data-theme="light"] {
        --splash-bg: #f6f8fb;
        --splash-text: #16212b;
        --splash-muted: #5f6f7d;
      }
      html, body {
        background: var(--splash-bg);
        color: var(--splash-text);
        margin: 0;
        min-height: 100vh;
      }
      #bootSplash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: var(--splash-bg);
        color: var(--splash-text);
        font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      }
      #bootSplash .splash-logo {
        width: 48px;
        height: 48px;
        border: 3px solid color-mix(in srgb, var(--splash-accent) 20%, transparent);
        border-top-color: var(--splash-accent);
        border-radius: 50%;
        animation: splashSpin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      .boot-splash-content {
        text-align: center;
      }
      #bootSplash .splash-text {
        color: var(--splash-muted);
        font-size: 0.875rem;
        line-height: 1.55;
      }
      @keyframes splashSpin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #bootSplash .splash-logo { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="bootSplash">
      <div class="boot-splash-content">
        <div class="splash-logo"></div>
        <div class="splash-text">股选优启动中…</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
