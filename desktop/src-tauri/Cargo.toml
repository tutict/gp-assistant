[package]
name = "stock-optimizer-desktop"
version = "0.6.2"
default-run = "stock-optimizer-desktop"
description = "Desktop shell for 鑲￠€変紭"
authors = ["鑲￠€変紭"]
edition = "2021"
rust-version = "1.99"

[lib]
name = "stock_optimizer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "stock-optimizer-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[features]
eval-replay = []
gepa-lab = ["dep:dsrust-gepa"]

[dependencies]
zeroize = "1.9.1"
aes-gcm = "0.11.1"
argon2 = "0.6.0"
getrandom = "0.4.3"
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
calamine = "0.37.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
stock-optimizer-core = { path = "../../native/gp-core" }
gp-research = { package = "stock-research", path = "../../native/gp-research" }
encoding_rs = "0.8.42"
futures = "0.3.34"
jieba-rs = "0.11"
lopdf = "0.46.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", features = ["stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
scraper = "0.29.0"
schemars = "1.2.3"
sha2 = "0.11.1"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-shell = "2.6.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "sync", "time"] }
webpki-roots = "1.0.11"
rig-core = { version = "0.45.0", default-features = false, features = ["reqwest", "rustls"] }
rig-agent = { version = "0.45.0", default-features = false }
dsrust-gepa = { version = "=0.1.0-alpha.3", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
fastembed = { version = "7.5.0", default-features = false, features = ["ort-download-binaries-rustls-tls"] }

windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-single-instance = "2.5.5"

[[bin]]
name = "rag_replay"
path = "src/bin/rag_replay.rs"
required-features = ["eval-replay"]
