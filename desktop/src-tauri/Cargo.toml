[package]
name = "gp-assistant-desktop"
version = "0.3.0"
description = "Desktop shell for A股选股智能体"
authors = ["A股选股智能体"]
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
gp-core = { path = "../../native/gp-core" }
encoding_rs = "0.8"
reqwest = "0.13.4"
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
