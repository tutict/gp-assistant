[package]
name = "stock-optimizer-desktop"
version = "0.3.0"
description = "Desktop shell for 股选优"
authors = ["股选优"]
edition = "2021"

[lib]
name = "stock_optimizer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "stock-optimizer-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
stock-optimizer-core = { path = "../../native/gp-core" }
encoding_rs = "0.8"
futures = "0.3"
reqwest = "0.13.4"
rustls = { version = "0.23.41", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["time"] }
webpki-roots = "1.0.6"
