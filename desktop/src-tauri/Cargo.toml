[package]
name = "gp-assistant-desktop"
version = "0.1.0"
description = "Desktop shell for GP Assistant"
authors = ["GP Assistant"]
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
gp-core = { path = "../../native/gp-core" }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
