[package]
name = "stock-optimizer-desktop"
version = "0.5.0"
description = "Desktop shell for 鑲￠€変紭"
authors = ["鑲￠€変紭"]
edition = "2021"

[lib]
name = "stock_optimizer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "stock-optimizer-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
stock-optimizer-core = { path = "../../native/gp-core" }
encoding_rs = "0.8"
futures = "0.3"
jieba-rs = "0.10"
lopdf = "0.44"
reqwest = { version = "0.13.4", features = ["stream"] }
rustls = { version = "0.23.41", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.25"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["net", "sync", "time"] }
webpki-roots = "1.0.6"

[target.'cfg(target_os = "windows")'.dependencies]
fastembed = { version = "5.17.3", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
